[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "afterimage"
dynamic = ["version"]
description = "Find every place a data subject can still be recovered in an Apache Iceberg lakehouse after a DELETE, and produce erasure evidence."
readme = "README.rst"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Farid Kosarifard" }]
maintainers = [{ name = "Farid Kosarifard" }]
keywords = ["iceberg", "gdpr", "right-to-erasure", "lakehouse", "data-engineering", "privacy", "pyiceberg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pyiceberg[pyarrow,sql-sqlite]>=0.10,<0.13",
    "pyarrow>=17",
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3,server]>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.34",
]

[project.scripts]
afterimage = "afterimage.cli:app"

[project.urls]
Homepage = "https://github.com/Faridkosarifard/afterimage"
Repository = "https://github.com/Faridkosarifard/afterimage"
Issues = "https://github.com/Faridkosarifard/afterimage/issues"
Changelog = "https://github.com/Faridkosarifard/afterimage/blob/main/CHANGELOG.rst"

[tool.hatch.version]
path = "src/afterimage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/afterimage"]

[tool.hatch.build.targets.sdist]
include = ["src/afterimage", "tests", "docs", "README.rst", "CHANGELOG.rst", "CONTRIBUTING.rst", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["afterimage"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests that create real Iceberg tables (local filesystem or mocked S3)",
]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["afterimage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
